[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ribozyme"
version = "0.1.0"
description = "RNA GNN classification for small RNAs and ribozymes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Jeff Liu", email = "jeffliu0@stanford.edu" },
]

dependencies = [
  "numpy>=1.26.0",
  "pandas>=2.1.0",
  "pydantic>=2.5.0",
  "biopython>=1.83",
  "scikit-learn>=1.3.0",
  "tqdm>=4.66.0",
  "hydra-core>=1.3.0",
  "omegaconf>=2.3.0",
  "wandb>=0.16.0",
]

[project.optional-dependencies]
gnn = [
  "torch>=2.0.0",
  "torch-geometric>=2.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
