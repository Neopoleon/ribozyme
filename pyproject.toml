[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ribozyme"
version = "0.1.0"
description = "RNA GNN classification for small RNAs and ribozymes"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Jeff Liu", email = "jeffliu0@stanford.edu" },
]

dependencies = [
  "numpy>=1.26.0",
  "pandas>=2.1.0",
  "pydantic>=2.5.0",
  "biopython>=1.83",
  "scikit-learn>=1.3.0",
  "tqdm>=4.66.0",
  "torch>=2.0.0",
  "torch-geometric>=2.3.0",
  "hydra-core>=1.3.0",
  "omegaconf>=2.3.0",
  "wandb>=0.16.0",
]

[project.scripts]
ribozyme-preprocess = "preprocessing.pipeline:main"

[tool.setuptools]
packages = ["preprocessing"]

[tool.setuptools.package-data]
preprocessing = ["py.typed"]
