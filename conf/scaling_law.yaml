# Hydra configuration for Scaling Law Experiment
# Usage:
#   Single run:  python train_scaling_law.py data_fraction=0.4 seed=0
#   Multirun:    python train_scaling_law.py -m data_fraction=1.0,0.8,0.4,0.2,0.1 seed=0,1,2,3,4
#   More extreme: python train_scaling_law.py -m data_fraction=1.0,0.8,0.4,0.2,0.1,0.05,0.02,0.01 seed=0,1,2,3,4

experiment_name: scaling_law_gin_frac${data_fraction}_seed${seed}_${now:%Y%m%d_%H%M%S}
output_dir: results/scaling_law

# Scaling experiment parameters
data_fraction: 1.0  # Fraction of training data to use (0.0 to 1.0)
seed: 0  # Random seed for stratified subsampling

# Data paths (defaults)
data:
  train_path: /home/jeff/ribozyme/data/splits/train_labels_7.json
  val_path: /home/jeff/ribozyme/data/splits/val_labels_7.json
  test_path: /home/jeff/ribozyme/data/splits/test_labels_7.json
  rfam_types_path: rfam/rfam_types_full.pkl
  st_files_dir: data/unzipped/bpRNA_1m_90_STAFILES

# Model configuration: GIN with all features (best-performing setup)
model:
  architecture: gin
  hidden_dim: 128
  num_layers: 3
  dropout: 0.3
  pooling: mean

# Training configuration
training:
  epochs: 100
  batch_size: 32
  lr: 0.001
  weight_decay: 0.00001
  use_class_weights: true
  patience: 20  # LR scheduler patience
  early_stop_patience: 30  # Early stopping patience

# Hydra configuration for multirun
hydra:
  mode: MULTIRUN
  sweeper:
    params:
      data_fraction: 1.0,0.8,0.4,0.2,0.1
      seed: 0,1,2,3,4
