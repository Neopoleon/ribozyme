# @package _global_
# Edge-aware GCN using NNConv to process 5D edge features

experiment_name: gcn_edge_with_edge_features

model:
  architecture: gcn_edge
  hidden_dim: 128
  num_layers: 3
  dropout: 0.3
  pooling: mean

features:
  use_nucleotide: true
  use_structure_annotation: true
  use_pseudoknot: true
  use_position_encoding: true

training:
  epochs: 100
  batch_size: 32
  lr: 0.001