experiment_name: seq_transformer_baseline
output_dir: results/seq_transformer_baseline
seed: 42

data:
  train_path: data/splits/train_labels.json
  val_path: data/splits/val_labels.json
  test_path: data/splits/test_labels.json
  rfam_types_path: rfam/rfam_types_full.pkl
  st_files_dir: data/unzipped/bpRNA_1m_90_STAFILES

model:
  embed_dim: 256
  num_heads: 8
  num_layers: 4
  ff_dim: 512
  dropout: 0.1
  max_seq_len: 4096

training:
  epochs: 100
  batch_size: 32
  lr: 0.0005
  weight_decay: 0.0001
  lr_patience: 5
  num_workers: 4
  use_class_weights: true
